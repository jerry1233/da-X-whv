<!DOCTYPE html>

<html>
<head>

    <meta charset="utf-8">

    <link rel="apple-touch-icon" sizes="76x76" href="./assets/img/apple-icon.png">
    <link rel="icon" type="image/png" href="./assets/img/favicon.png">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>

    <link rel="stylesheet" href="css/popup.css"/>
    <link rel="stylesheet" href="assets/bootstrap-4.0.0-dist/css/bootstrap.min.css">
    <script src="js/popper.min.js"></script>
    <script src="assets/bootstrap-4.0.0-dist/js/bootstrap.js"></script>
    <link href="assets/css/material-kit.css?v=2.0.7" rel="stylesheet"/>
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/google-font.css">
    <script src="js/jquery-3.5.1.min.js"></script>

</head>

<body>
<div id="great-x-plugin">
    <div class="page-header header-filter clear-filter purple-filter plugin" data-parallax="true"
         style="  transform: translate3d(0px, 0px, 0px);">
        <div class="container header-container">
            <div class="row ">
                <div class="col-12 ml-auto mr-auto">
                    <div class="brand">
                        <a href="https://iwhver.com/greatX" target="_blank">
                            <h3>打工度假自动填表插件-大X</h3>
                            <p>纽澳通用版 3.0 &nbsp澳打君</p>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="main main-raised setting-main">
        <div class="section section-navbars cd-section" id="navigation">
            <div class="container">
                <!--                 menu -->
                <div class="row">
                    <div class="col-12">
                        <div class="d-flex justify-content-center">
                            <div class="btn-group btn-group-toggle" data-toggle="buttons">
                                <label class="btn btn-secondary auto-type  setting-button-group" id="setting_mode_value_auto" data-key="mode" data-value="auto">
                                    <input type="radio" name="options"  checked> <i class="material-icons">double_arrow</i>
                                    自动填表+提交
                                </label>
                                <label class="btn btn-secondary auto-type setting-button-group" id="setting_mode_value_fill" data-key="mode" data-value="fill">
                                    <input type="radio" name="options" > <i class="material-icons">keyboard_arrow_right</i>仅自动填表
                                    <div class="ripple-container"></div>
                                </label>
                                <label class="btn btn-secondary auto-type setting-button-group" id="setting_mode_value_off" data-key="mode" data-value="off">
                                    <input type="radio" name="options" > <i class="material-icons">highlight_off</i>关闭
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12">
                        <div class="d-flex justify-content-center">
                            <div class="btn-group btn-group-toggle " data-toggle="buttons">
                                <label class="btn btn-secondary setting-button-group" data-key="country" data-value="au">
                                    <input type="radio" name="options" id="option1"> 澳大利亚
                                </label>
                                <label class="btn btn-secondary setting-button-group" data-key="country" data-value="nz">
                                    <input type="radio" name="options" id="option2" checked> 新西兰
                                    <div class="ripple-container"></div>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12">
                        <div class="d-flex justify-content-center">
                            <div class="btn-group btn-group-toggle" data-toggle="buttons">
                                <label class="btn btn-secondary  setting-button-group" data-key="auto-jump" data-value="1">
                                    <input type="radio" name="options" id="option1" checked> 自动提交时未知页自动跳转
                                </label>
                                <label class="btn btn-secondary  setting-button-group" data-key="auto-jump" data-value="0">
                                    <input type="radio" name="options" id="option2"> 未知页不操作
                                    <div class="ripple-container"></div>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>


                <div class="row justify-content-center" id="jump-to-link-value-module">
                    <div class="col-12 align-self-center">
                        <div class="form-group bmd-form-group">
                            <div class="d-flex justify-content-center" >
                                <label for="exampleInput1" class="bmd-label-floating">跳转至链接</label>
                                <input type="url" class="form-control input-jump-url" id="jump-to-link-value" data-key="jump-url">
                            </div>
                        </div>
                    </div>
                </div>



                <div class="row">
                    <div class="col-12">
                        <div class="d-flex justify-content-center">
                            <div class="btn-group btn-group-toggle" data-toggle="buttons">
                                <label class="btn btn-secondary  setting-button-group" data-key="teaching-mode" data-value="1">
                                    <input type="radio" name="options" id="option1" checked> 弹出蓝色教学提示
                                </label>
                                <label class="btn btn-secondary  setting-button-group" data-key="teaching-mode" data-value="0">
                                    <input type="radio" name="options" id="option2"> 不弹出
                                    <div class="ripple-container"></div>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row justify-content-center">
                    <div class=" d-flex justify-content-center align-items-center">
                        <label class="col-2 col-form-label">使用</label>

                        <div class="input-group is-invalid">
                            <select class="custom-select select-info" id="select-info-group"  required  data-key="info-group">
                                <option value="0">个人资料1</option>
                                <option value="1">个人资料2</option>
                                <option value="2">个人资料3</option>
                                <option value="3">个人资料4</option>
                                <option value="4">个人资料5</option>
                                <option value="5">个人资料6</option>
                                <option value="6">个人资料7</option>
                                <option value="7">个人资料8</option>
                            </select>
                        </div>

                        <button type="button" id="info-edit" class="btn btn-primary change-info">修改资料</button>
                    </div>
                </div>

                <div class="row justify-content-center">
                    <div class="col-6 align-self-center">
                        <div class="d-flex justify-content-center">
                            <button class="btn btn-primary btn-round quick-link">
                                <i class="material-icons">build</i> 快捷链接
                            </button>
                        </div>
                    </div>
                </div>


                <div class="row" id="super-1" style="display:none">
                    <div class="col-12">
                        <div class="d-flex justify-content-center">
                            <div class="btn-group btn-group-toggle " data-toggle="buttons">
                                <label class="btn btn-secondary setting-button-group" data-key="test-mode" data-value="1">
                                    <input type="radio" name="options" id="option1" checked>测试模式
                                </label>
                                <label class="btn btn-secondary setting-button-group" data-key="test-mode" data-value="0">
                                    <input type="radio" name="options" id="option2"> 非测试模式
                                    <div class="ripple-container"></div>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>


                <div class="row justify-content-center" id="auto-refresh-interval-module" style="display:none">
                    <div class="col-12 align-self-center">
                        <div class="form-group bmd-form-group">
                            <div class="d-flex justify-content-center" >
                                <label class="bmd-label-floating">刷新间隔（ms）</label>
                                <input  class="form-control input-jump-url" id="auto-refresh-interval" data-key="auto-refresh-interval">
                            </div>
                        </div>
                    </div>
                </div>


            </div>
        </div>
    </div>
</div>
<footer class="footer" data-background-color="black">
    <div class="container footer-container">
        <nav class="">
            <ul>
                <li>
                    <a href="https://iwhver.com/greatX" target="_blank">
                        使用指南
                    </a>
                </li>
                <li>
                    <a href="https://iwhver.com/service" target="_blank">
                        名额代抢
                    </a>
                </li>
                <li>
                    <a href="https://iwhver.com/list" target="_blank">
                        申请攻略
                    </a>
                </li>
                <li>
                    <a href="https://iwhver.com/inform" target="_blank">
                        情报推送
                    </a>
                </li>
            </ul>
        </nav>

    </div>
    <span class="badge badge-pill badge-success saved-badge">已保存</span>
</footer>

<script src="assets/js/plugins/nouislider.min.js" type="text/javascript"></script>

<!-- Control Center for Material Kit: parallax effects, scripts for the example pages etc -->
<script src="assets/js/material-kit.js?v=2.0.7" type="text/javascript"></script>

<script src="js/popup.js"></script>



</body>



</html>

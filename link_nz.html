<!DOCTYPE html>

<html>
<head>

    <meta charset="utf-8">

    <link rel="apple-touch-icon" sizes="76x76" href="./assets/img/apple-icon.png">
    <link rel="icon" type="image/png" href="./assets/img/favicon.png">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>

    <link rel="stylesheet" href="css/popup.css"/>
    <link rel="stylesheet" href="assets/bootstrap-4.0.0-dist/css/bootstrap.min.css">
    <script src="js/jquery-3.5.1.min.js"></script>
    <script src="js/popper.min.js"></script>

    <script src="assets/bootstrap-4.0.0-dist/js/bootstrap.min.js"></script>
    <link href="assets/css/material-kit.css?v=2.0.7" rel="stylesheet"/>
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/google-font.css">
    <link href="assets/demo/demo.css" rel="stylesheet"/>

</head>

<body>
<div id="great-x-plugin">
    <div class="page-header header-filter clear-filter purple-filter plugin" data-parallax="true"
         style="  transform: translate3d(0px, 0px, 0px);">
        <div class="container header-container">
            <div class="row ">
                <div class="col-12 ml-auto mr-auto">
                    <div class="brand">
                        <a href="https://iwhver.com/greatX" target="_blank">
                            <h3>打工度假自动填表插件-大X</h3>
                            <p>纽澳通用版 3.0 &nbsp澳打君</p>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="main main-raised setting-main">
        <div class="section section-navbars cd-section" id="navigation">
            <div class="container">

                <div class="row ">
                    <div class="col-12">
                        <div class="d-flex justify-content-center">
                            <div class="btn-group btn-group-toggle" data-toggle="buttons">
                                <label class="btn btn-secondary  setting-button-group" data-key="manual-nz-form-number" data-value="0">
                                    <input type="radio" name="options" id="option2"> 自动探测表格号
                                    <div class="ripple-container"></div>
                                </label>
                                <label class="btn btn-secondary  setting-button-group" data-key="manual-nz-form-number" data-value="1">
                                    <input type="radio" name="options" id="option1" checked> 手动输入表格号
                                </label>

                            </div>
                        </div>
                    </div>
                </div>


                <div class="row justify-content-center jump-to-link-value-module-height" id="enter-nz-form-number-module">
                    <div class="col-12 align-self-center">
                        <div class="form-group bmd-form-group">
                            <div class="d-flex justify-content-center" >
                                <label  class="bmd-label-floating">在此输入表格号</label>
                                <input type="" class="form-control input-jump-url" id="nz-form-number" data-key="nz-form-number">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row justify-content-center jump-to-link-value-module-height"  id="quota-notice-info-module">
                    <div class="col-12 align-self-center">
                        <div class="alert alert-success fade show" id="quota-notice-info" role="alert">
                            <strong id="quota-notice-info-detail">暂未探测到表格号</strong>
                        </div>
                    </div>
                </div>


                <div class="row justify-content-center" id="quick-link-button-module">
                    <div class="col-12 align-self-center">
                        <div class="d-flex justify-content-center" >
                            <button type="button" class="btn btn-primary quick-link"  data-key="Personaldetails" id="Personaldetails" >打开 Personal details 页</button>
                            <button type="button" class="btn btn-default copy-link"  data-key="PersonaldetailsCopy" id="PersonaldetailsCopy">暂无链接</button>
                        </div>
                        <div class="d-flex justify-content-center" >
                            <button type="button" class="btn btn-primary quick-link" data-key="Identification" id="Identification" >打开 Identification 页</button>
                            <button type="button" class="btn btn-default copy-link" data-key="IdentificationCopy" id="IdentificationCopy">暂无链接</button>
                        </div>
                        <div class="d-flex justify-content-center" >
                            <button type="button" class="btn btn-primary quick-link"  data-key="Health"  id="Health">打开 Health 页</button>
                            <button type="button" class="btn btn-default copy-link" data-key="HealthCopy" id="HealthCopy">暂无链接</button>
                        </div>
                        <div class="d-flex justify-content-center" >
                            <button type="button" class="btn btn-primary quick-link" data-key="Character" id="Character">打开 Character 页</button>
                            <button type="button" class="btn btn-default copy-link" data-key="CharacterCopy" id="CharacterCopy">暂无链接</button>
                        </div>
                        <div class="d-flex justify-content-center" >
                            <button type="button" class="btn btn-primary quick-link"  data-key="WHSSpecific" id="WHSSpecific">打开 WHS Specific 页</button>
                            <button type="button" class="btn btn-default copy-link" data-key="WHSSpecificCopy" id="WHSSpecificCopy">暂无链接</button>
                        </div>
                        <div class="d-flex justify-content-center" >
                            <button type="button" class="btn btn-primary quick-link"   data-key="Submit"  id="Submit">打开 Submit 页</button>
                            <button type="button" class="btn btn-default copy-link" data-key="SubmitCopy" id="SubmitCopy">暂无链接
                            </button>
                        </div>
                        <div class="d-flex justify-content-center" >
                            <button type="button" class="btn btn-primary quick-link-default"    id="loginPage">抢名额登陆页</button>
                            <button type="button" class="btn btn-default copy-link-default"  id="loginPageCopy">复制链接
                            </button>
                        </div>
                        <div class="d-flex justify-content-center" >
                            <button type="button" class="btn btn-primary quick-link-default"    id="WHVHomePage">WHV Home 页</button>
                            <button type="button" class="btn btn-default copy-link-default" id="WHVHomePageCopy">复制链接
                            </button>
                        </div>
                        <div class="d-flex justify-content-center" >
                            <button type="button" class="btn btn-primary quick-link-default"    id="ImmiWHVPage">移民局 WHV 页</button>
                            <button type="button" class="btn btn-default copy-link-default" id="ImmiWHVPageCopy">复制链接
                            </button>
                        </div>
                    </div>
                </div>




            </div>
        </div>
    </div>
</div>
<footer class="footer" data-background-color="black">
    <div class="container footer-container">
        <nav class="">
            <ul>
                <li>
                    <a href="https://iwhver.com/greatX" target="_blank">
                        使用指南
                    </a>
                </li>
                <li>
                    <a href="https://iwhver.com/service" target="_blank">
                        名额代抢
                    </a>
                </li>
                <li>
                    <a href="https://iwhver.com/list" target="_blank">
                        申请攻略
                    </a>
                </li>
                <li>
                    <a href="https://iwhver.com/inform" target="_blank">
                        情报推送
                    </a>
                </li>
            </ul>
        </nav>

    </div>
    <span class="badge badge-pill badge-success saved-badge">已保存</span>
</footer>

<script src="js/link_nz.js"></script>



</body>



</html>
